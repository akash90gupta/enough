name: Daily edition

on:
  schedule:
    - cron: '23 12 * * *'  # about 5:20am Pacific in summer; off the top of the hour, when GitHub drops scheduled runs
  workflow_dispatch:
    inputs:
      rewrite:
        description: Rewrite today's edition even if it already exists
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Decide whether to write
        id: plan
        run: |
          DATE=$(TZ=America/Los_Angeles date +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then echo "write=false" >> "$GITHUB_OUTPUT";
          elif [ -f "data/editions/$DATE.json" ] && [ "${{ inputs.rewrite }}" != "true" ]; then echo "write=false" >> "$GITHUB_OUTPUT";
          else echo "write=true" >> "$GITHUB_OUTPUT"; fi

      - name: Read the news
        if: steps.plan.outputs.write == 'true'
        run: npm run read

      # Claude writes the edition, through either a Claude Pro/Max subscription
      # (CLAUDE_CODE_OAUTH_TOKEN, no extra cost) or a pay-per-use API key (ANTHROPIC_API_KEY).
      - name: Write the edition
        if: steps.plan.outputs.write == 'true'
        timeout-minutes: 25
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Add a CLAUDE_CODE_OAUTH_TOKEN (from 'claude setup-token') or ANTHROPIC_API_KEY repository secret."
            exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then npm install -g @anthropic-ai/claude-code; fi
          npm run write

      - name: Resolve leftover source links
        run: node src/links.mjs

      - name: Save to the public record
        run: |
          git config user.name "Enough.ai"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Nothing new to save" || git commit -m "Edition for ${{ steps.plan.outputs.date }}"
          git push

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
